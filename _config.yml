# Internal nav
nav:
  - L'EDITO: "http://127.0.0.1:4000/revendik-ledito/ledito/"  
  - CA BOUGE !: "http://127.0.0.1:4000/revendik-ledito/cabouge/"
  - PLUS D'INFO: "http://127.0.0.1:4000/revendik-ledito/info/"
